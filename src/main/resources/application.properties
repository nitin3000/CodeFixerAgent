# Server Port Configuration
server.port=9090

# Spring Application Metadata
spring.application.name=ai-bug-fixer-agent

# Logging Matrix Scoping
logging.level.org.springframework.web=INFO
://level.com.propapp.agent=DEBUG

# Multipart File Limits (Optional: protects against abnormally large webhook payload blocks)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
